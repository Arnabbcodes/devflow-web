<!-- components/navbar.html -->
<header class="top-navbar">
  <div class="navbar-left">
    <button class="mobile-menu-btn" id="mobile-sidebar-toggle" aria-label="Toggle navigation">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <div class="page-title">
      <span id="page-title-text">Dashboard</span>
    </div>
  </div>

  <div class="navbar-right">
    <!-- AI Quick Action -->
    <button class="btn btn-ai btn-sm" id="global-ai-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
      <span>Ask Groq AI</span>
    </button>

    <!-- Notifications Bell -->
    <div style="position: relative;">
      <button class="btn btn-secondary btn-icon" id="notification-btn" aria-label="Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span id="unread-notification-dot" style="display:none; position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; background: #ef4444; border-radius: 50%;"></span>
      </button>
      
      <!-- Notification Dropdown Panel -->
      <div id="notification-dropdown" class="glass-panel" style="display:none; position: absolute; right: 0; top: 48px; width: 340px; padding: 1rem; z-index: 200; box-shadow: var(--shadow-lg);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.5rem;">
          <h4 style="font-size: 0.95rem; font-weight: 700;">Notifications</h4>
          <button id="mark-all-read-btn" class="btn-ghost" style="font-size: 0.75rem; cursor: pointer; color: var(--primary-light);">Mark all read</button>
        </div>
        <div id="notification-items-list" style="display: flex; flex-direction: column; gap: 0.5rem; max-height: 280px; overflow-y: auto;">
          <!-- Loaded dynamically -->
        </div>
      </div>
    </div>

    <!-- User Profile Dropdown / Link -->
    <a href="profile.html" class="user-avatar" id="nav-user-avatar" title="View Profile" style="text-decoration: none;">
      DF
    </a>
  </div>
</header>
