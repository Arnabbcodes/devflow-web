<!-- components/aiPanel.html - Floating or drawer AI assistant interface -->
<div id="ai-assistant-modal" class="modal-backdrop">
  <div class="modal-container" style="max-width: 650px;">
    <div class="modal-header" style="background: linear-gradient(135deg, rgba(6,182,212,0.1), rgba(99,102,241,0.1));">
      <div style="display:flex; align-items:center; gap: 0.6rem;">
        <span style="display:inline-flex; width: 28px; height: 28px; border-radius: 6px; background: var(--grad-ai); align-items:center; justify-content:center; color:#fff; font-size:0.8rem;">⚡</span>
        <h3>DevFlow Groq AI Assistant</h3>
      </div>
      <button class="modal-close-btn" id="ai-modal-close">✕</button>
    </div>

    <div class="modal-body" style="padding: 1.5rem;">
      <div style="margin-bottom: 1.25rem;">
        <label class="form-label">What would you like Groq to architect or analyze?</label>
        <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap;">
          <button class="btn btn-secondary btn-sm ai-preset-btn" data-mode="breakdown">Break down task</button>
          <button class="btn btn-secondary btn-sm ai-preset-btn" data-mode="daily">Plan my day</button>
          <button class="btn btn-secondary btn-sm ai-preset-btn" data-mode="priority">Analyze priorities</button>
          <button class="btn btn-secondary btn-sm ai-preset-btn" data-mode="project">New project blueprint</button>
        </div>
      </div>

      <div class="form-group">
        <textarea id="ai-prompt-input" class="form-control" rows="3" placeholder="e.g. Architect a Stripe webhook subscription handler with idempotency and retry queue..."></textarea>
      </div>

      <div style="display: flex; justify-content: flex-end; margin-bottom: 1.25rem;">
        <button class="btn btn-ai" id="ai-run-btn">
          <span>Run AI Inference</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>

      <!-- Result Display Area -->
      <div id="ai-result-area" class="glass-panel" style="display:none; padding: 1.25rem; max-height: 280px; overflow-y: auto; font-size: 0.88rem;">
        <div id="ai-result-spinner" style="text-align: center; padding: 1.5rem; display:none;">
          <div class="spinner"></div>
          <p style="margin-top: 0.5rem; color: var(--text-secondary);">Querying Groq via Supabase Edge Function...</p>
        </div>
        <div id="ai-result-content"></div>
      </div>
    </div>
  </div>
</div>
