<!-- components/modal.html - Generic modal wrapper template -->
<div class="modal-backdrop" id="app-modal-backdrop">
  <div class="modal-container" id="app-modal-container">
    <div class="modal-header">
      <h3 id="modal-title">Modal Title</h3>
      <button class="modal-close-btn" id="modal-close-btn" aria-label="Close modal">✕</button>
    </div>
    <div class="modal-body" id="modal-body-content">
      <!-- Dynamic form content -->
    </div>
    <div class="modal-footer" id="modal-footer-actions">
      <button class="btn btn-secondary" id="modal-cancel-btn">Cancel</button>
      <button class="btn btn-primary" id="modal-confirm-btn">Confirm</button>
    </div>
  </div>
</div>
