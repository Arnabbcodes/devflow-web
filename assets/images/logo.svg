<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon Mark -->
  <g transform="translate(6, 6)">
    <rect x="2" y="2" width="44" height="44" rx="12" fill="#1e1e2f" stroke="url(#logo-grad)" stroke-width="2"/>
    <path d="M14 24L22 16L18 32L34 24L26 32" stroke="url(#logo-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="34" cy="16" r="3" fill="#06b6d4" />
    <path d="M16 36L32 36" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="64" y="38" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="26" fill="#f8fafc" letter-spacing="-0.5">Dev<tspan fill="url(#logo-grad)">Flow</tspan></text>
  <text x="180" y="25" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="10" fill="#06b6d4" letter-spacing="1">AI</text>
  <rect x="176" y="14" width="22" height="15" rx="4" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
</svg>
